<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第 1 关 · 拼豆像素画 · MatterBench 在线体验</title>
  <meta name="description" content="照着淡淡的图案,一颗一颗拼出你的拼豆伙伴。">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/demo.css">
  <script>
    try { const t = localStorage.getItem("mb.demo.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="config.js"></script>
  <script src="assets/cardgen.js" defer></script>
  <script src="assets/quest.js" defer></script>
  <script src="assets/pixel.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="logo" href="demo.html" title="回到我的伙伴">
      <img src="assets/logo.svg" alt="">
      <b>MatterBench</b>
      <span class="ver">第 1 关 · 拼豆像素画</span>
    </a>
    <div class="bar-mid">
      <button class="icon" id="undo" title="撤销 (Ctrl+Z)" aria-label="撤销"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="icon" id="redo" title="重做 (Ctrl+Shift+Z)" aria-label="重做"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="bar-right">
      <a class="txt txt-go" href="demo.html">← 我的伙伴</a>
    </div>
  </header>

  <div class="app" id="app">
    <main class="view" id="view">
      <div class="stage-card" id="stepCard"></div>
      <div class="stage2d" id="stage2d"><canvas id="board" aria-label="拼豆板"></canvas></div>
    </main>

    <aside class="side" id="side">
      <section class="grp quest" id="quest"></section>

      <section class="grp" data-step="2">
        <h4>颜色</h4>
        <div class="swatches" id="palette"></div>
        <div class="seg seg-full">
          <button id="modeDraw" aria-pressed="true">画</button>
          <button id="modeErase" aria-pressed="false">擦</button>
        </div>
      </section>

      <section class="grp" data-step="4">
        <h4>带走</h4>
        <button class="btn-sub" id="dlPng">下载我的图案</button>
      </section>

      <details class="more-box" id="moreBox">
        <summary>更多</summary>
        <section class="grp">
          <h4>换个图案</h4>
          <div class="chips-s" id="guides">
            <button data-guide="pal" aria-pressed="false">我的伙伴</button>
            <button data-guide="heart" aria-pressed="false">爱心</button>
            <button data-guide="smile" aria-pressed="false">笑脸</button>
            <button data-guide="mushroom" aria-pressed="false">小蘑菇</button>
            <button data-guide="none" aria-pressed="false">自由画</button>
          </div>
          <p class="fine" style="text-align:left">每颗豆是一段直径 5 mm 的小圆管,到第 4 关会把它们叠成立体的。</p>
        </section>
        <section class="grp">
          <div class="stats stats-2">
            <div><b id="sumParts">0</b><span>颗豆</span></div>
            <div><b id="sumColors">0</b><span>种颜色</span></div>
          </div>
        </section>
      </details>

      <nav class="side-foot">
        <a href="demo.html">← 回到我的伙伴</a>
      </nav>
    </aside>
  </div>

  <footer class="status">
    <span id="statusInfo">—</span>
    <span class="hint">点一下放一颗 · 按住拖动连续画 · Ctrl+Z 撤销</span>
  </footer>
</body>
</html>
