<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第 2 关 · 发光拼豆灯罩 · MatterBench 在线体验</title>
  <meta name="description" content="把你的拼豆伙伴拼到灯罩上,开灯看它发光,再带走图纸和 ESP32 代码。">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/demo.css">
  <script>
    try { const t = localStorage.getItem("mb.demo.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script src="config.js"></script>
  <script src="assets/cardgen.js" defer></script>
  <script src="assets/quest.js" defer></script>
  <script src="assets/lamp.js" defer></script>
  <script type="module" src="assets/lamp3d.js"></script>
</head>
<body>
  <header class="bar">
    <a class="logo" href="demo.html" title="回到我的伙伴">
      <img src="assets/logo.svg" alt="">
      <b>MatterBench</b>
      <span class="ver">第 2 关 · 发光拼豆灯罩</span>
    </a>
    <div class="bar-mid">
      <button class="icon" id="undo" title="撤销 (Ctrl+Z)" aria-label="撤销"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="icon" id="redo" title="重做 (Ctrl+Shift+Z)" aria-label="重做"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="bar-right">
      <a class="txt txt-go" href="demo.html">← 我的伙伴</a>
    </div>
  </header>

  <div class="app" id="app">
    <main class="view" id="view">
      <div class="stage-card" id="stepCard"></div>
      <div class="view-tabs" role="tablist" aria-label="视图" data-step="3">
        <button role="tab" data-view="2d" aria-selected="true">展开图</button>
        <button role="tab" data-view="3d" aria-selected="false">3D 灯罩</button>
      </div>
      <button class="lamp-switch" id="lampSwitch" aria-pressed="false" title="开灯 / 关灯 (L)" data-step="2">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span>开灯</span>
      </button>
      <div class="stage2d" id="stage2d"><canvas id="board" aria-label="灯罩展开图"></canvas></div>
      <div class="stage3d" id="stage3d" hidden></div>
      <div class="view-msg" id="viewMsg" hidden></div>
      <button class="collapse" id="collapse" title="收起 / 展开侧栏" aria-label="收起或展开侧栏"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </main>

    <aside class="side" id="side">
      <section class="grp quest" id="quest"></section>

      <!-- ---------- 图案 ---------- -->
      <section class="grp">
        <h4>灯罩图案 <span class="tip" title="灯罩有四面,每面 16 × 16 颗拼豆。左边是四面摊开的样子,也可以直接在上面点着画。">i</span></h4>
        <div class="tpl-row" id="templates">
          <button class="tpl" data-tpl="pal" hidden><i id="tplPal"></i>我的伙伴</button>
          <button class="tpl" data-tpl="stars"><i style="background:linear-gradient(135deg,#1B2A4A,#2C3E6B)"></i>星空</button>
          <button class="tpl" data-tpl="hearts"><i style="background:radial-gradient(circle,#E5484D 35%,#F6E7DA 36%)"></i>爱心</button>
          <button class="tpl" data-tpl="window"><i style="background:linear-gradient(#F5D547 0 0) 50% 50%/40% 50% no-repeat,#5B3A29"></i>小屋</button>
        </div>
      </section>

      <!-- ---------- 导出 ---------- -->
      <section class="grp" data-step="4">
        <h4>带走</h4>
        <div class="row2">
          <button class="btn-sub" id="dlPng">下载图纸</button>
          <button class="btn-sub" id="dlCode">下载 ESP32 代码</button>
        </div>
        <p class="fine" style="text-align:left">代码用 Arduino IDE + FastLED 库,灯板数据线接 GPIO 5。</p>
      </section>

      <details class="more-box" id="moreBox">
        <summary>更多</summary>
        <section class="grp">
          <h4>自己画</h4>
          <div class="swatches" id="palette"></div>
          <div class="row">
            <input type="color" id="customColor" value="#7A4FD6" aria-label="自定义颜色">
            <button class="btn-sub grow" id="addColor">＋ 加入这个颜色</button>
          </div>
          <div class="seg seg-full" id="tools">
            <button data-tool="pen" aria-pressed="true">画笔</button>
            <button data-tool="fill" aria-pressed="false">填充</button>
            <button data-tool="erase" aria-pressed="false">留空</button>
          </div>
          <div class="row2">
            <button class="btn-sub" id="copyFace">把<b id="activeFaceName">前面</b>复制到四面</button>
            <button class="btn-sub" id="clear">清空四面</button>
          </div>
          <div class="tpl-row">
            <button class="tpl" data-tpl="stripes"><i style="background:linear-gradient(90deg,#E5484D,#F5D547,#3DB86B,#3E63DD,#8E4EC6)"></i>彩条</button>
          </div>
          <button class="btn-sub" id="importImage">用一张图片铺满四面…</button>
          <input type="file" id="imageInput" accept="image/*" hidden>
          <div class="slider">
            <label for="colorCount">图片最多颜色</label>
            <input type="range" id="colorCount" min="2" max="10" value="5">
            <output id="colorCountLabel">5</output>
          </div>
          <p class="fine" style="text-align:left">全部在你的浏览器里运行,不上传任何数据。</p>
        </section>
        <section class="grp">
          <h4>灯效 · ESP32 + LED 面板 <span class="tip" title="灯罩里面是 4 块 8×8 的 RGB 灯板,接在一块 ESP32 上。这里选的灯效,就是下载的代码会跑的效果。">i</span></h4>
          <div class="chips-s" id="effects">
            <button data-fx="solid" aria-pressed="true">常亮</button>
            <button data-fx="breathe" aria-pressed="false">呼吸</button>
            <button data-fx="rainbow" aria-pressed="false">彩虹环绕</button>
            <button data-fx="rise" aria-pressed="false">流光上升</button>
            <button data-fx="twinkle" aria-pressed="false">星光闪烁</button>
          </div>
          <div class="row" id="lightColorRow">
            <input type="color" id="lightColor" value="#FFB65C" aria-label="灯光颜色">
            <div class="chips-s grow" id="lightPresets">
              <button data-c="#FFB65C">暖光</button>
              <button data-c="#FFFFFF">白光</button>
              <button data-c="#7FD4FF">冷蓝</button>
              <button data-c="#FF5FA2">粉紫</button>
            </div>
          </div>
          <div class="slider">
            <label for="brightness">亮度</label>
            <input type="range" id="brightness" min="10" max="100" value="70">
            <output id="brightnessLabel">70%</output>
          </div>
          <div class="slider" id="speedRow">
            <label for="speed">速度</label>
            <input type="range" id="speed" min="1" max="10" value="4">
            <output id="speedLabel">4</output>
          </div>
        </section>
        <section class="grp">
          <h4>材料清单</h4>
          <div class="stats stats-2">
            <div><b id="sumParts">0</b><span>颗拼豆</span></div>
            <div><b id="sumColors">0</b><span>种颜色</span></div>
          </div>
          <table class="bom"><thead><tr><th>拼豆颜色</th><th class="num">颗数</th></tr></thead><tbody id="bom"></tbody></table>
          <table class="bom">
            <thead><tr><th>电子件</th><th class="num">数量</th></tr></thead>
            <tbody>
              <tr><td>ESP32 开发板</td><td class="num">1</td></tr>
              <tr><td>8×8 RGB 灯板(WS2812B)</td><td class="num">4</td></tr>
              <tr><td>5V 3A 电源 + USB 线</td><td class="num">1</td></tr>
              <tr><td>杜邦线 / 导线</td><td class="num">若干</td></tr>
            </tbody>
          </table>
        </section>
      </details>

      <nav class="side-foot">
        <a href="demo.html">← 回到我的伙伴</a>
      </nav>
    </aside>
  </div>

  <footer class="status">
    <span id="statusInfo">—</span>
    <label class="check"><input type="checkbox" id="optGrid" checked> 辅助线</label>
    <span class="hint" id="statusHint"></span>
  </footer>

</body>
</html>
