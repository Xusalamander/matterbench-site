<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线体验 · MatterBench</title>
  <meta name="description" content="三个小关卡:拼豆像素画、发光拼豆灯罩、会动的豆条小人。全部在浏览器里运行,不用注册。">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/demo.css">
  <script>
    try { const t = localStorage.getItem("mb.demo.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="assets/quest.js" defer></script>
</head>
<body class="hub-page">
  <header class="bar">
    <a class="logo" href="index.html" title="回到介绍页">
      <img src="assets/logo.svg" alt="">
      <b>MatterBench</b>
      <span class="ver">在线体验</span>
    </a>
    <div class="bar-right" style="margin-left:auto">
      <a class="txt hide-sm" href="index.html">了解 MatterBench</a>
      <a class="txt txt-go" href="index.html#join" data-go-join>我感兴趣</a>
    </div>
  </header>

  <main class="hub">
    <div class="hub-in">
      <h1>选一关开始</h1>
      <p class="lead">从简单的开始,每关几分钟。全部在浏览器里运行,不用注册,不上传任何数据。</p>

      <div class="levels">
        <a class="level" href="pixel.html" data-level="pixel">
          <div class="level-pic" aria-hidden="true">
            <svg viewBox="0 0 320 200">
              <rect width="320" height="200" fill="#16181D"/>
              <g id="hubHeart"></g>
            </svg>
          </div>
          <div class="level-body">
            <div class="stars">★<span>★★</span></div>
            <b>第 1 关 · 拼豆像素画</b>
            <p>选颜色,在格子上点一点,拼出一个小图案。只有画、擦、撤销三个按钮。</p>
            <span class="level-go">开始 →</span>
          </div>
        </a>

        <a class="level" href="lamp.html" data-level="lamp">
          <div class="level-pic" aria-hidden="true">
            <svg viewBox="0 0 320 200">
              <defs><radialGradient id="hg" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#FFB65C" stop-opacity=".55"/><stop offset="1" stop-color="#FFB65C" stop-opacity="0"/></radialGradient></defs>
              <rect width="320" height="200" fill="#07080A"/>
              <circle cx="160" cy="100" r="110" fill="url(#hg)"/>
              <rect x="110" y="40" width="100" height="110" rx="4" fill="#2C2740"/>
              <g fill="#FFD27A"><circle cx="130" cy="62" r="5"/><circle cx="182" cy="78" r="5"/><circle cx="150" cy="104" r="5"/><circle cx="194" cy="122" r="5"/><circle cx="126" cy="132" r="5"/></g>
              <rect x="104" y="150" width="112" height="10" rx="3" fill="#2A2D34"/>
            </svg>
          </div>
          <div class="level-body">
            <div class="stars">★★<span>★</span></div>
            <b>第 2 关 · 发光拼豆灯罩</b>
            <p>给灯罩四面拼图案,里面的 ESP32 灯板选个灯效,开灯看光透出来,还能带走代码。</p>
            <span class="level-go">开始 →</span>
          </div>
        </a>

        <a class="level" href="puppet.html" data-level="puppet">
          <div class="level-pic" aria-hidden="true">
            <svg viewBox="0 0 320 200">
              <rect width="320" height="200" fill="#16181D"/>
              <g id="hubPuppet"></g>
            </svg>
          </div>
          <div class="level-body">
            <div class="stars">★★★</div>
            <b>第 3 关 · 会动的豆条小人</b>
            <p>用豆条拼一个小人,豆子上的孔就是关节。拖动四肢摆姿势,再让它走起来。</p>
            <span class="level-go">开始 →</span>
          </div>
        </a>
      </div>
    </div>
  </main>

  <script>
    // 缩略图:几颗豆子画出来,省得放图片
    const NS = "http://www.w3.org/2000/svg";
    function bead(g, x, y, r, fill) {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r); c.setAttribute("fill", fill);
      g.appendChild(c);
      const h = document.createElementNS(NS, "circle");
      h.setAttribute("cx", x); h.setAttribute("cy", y); h.setAttribute("r", r * 0.38); h.setAttribute("fill", "rgba(0,0,0,.25)");
      g.appendChild(h);
    }
    const HEART = ["..XX.XX..", ".XRRXRRX.", "XRRRRRRRX", "XRRRRRRRX", ".XRRRRRX.", "..XRRRX..", "...XRX...", "....X...."];
    const hh = document.getElementById("hubHeart");
    HEART.forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch !== ".") bead(hh, 96 + i * 16, 40 + j * 16, 7, ch === "X" ? "#F6E7DA" : "#E5484D");
    }));
    // 豆条小人:一根根豆条
    const hp = document.getElementById("hubPuppet");
    function strip(x0, y0, ang, n, col) {
      const a = ang * Math.PI / 180;
      for (let k = 0; k < n; k++) bead(hp, x0 + Math.cos(a) * k * 13, y0 + Math.sin(a) * k * 13, 6, col);
    }
    strip(140, 92, 125, 4, "#E5484D"); strip(170, 92, 55, 4, "#E5484D");
    strip(155, 92, 105, 5, "#1F8FA6"); strip(155, 92, 75, 5, "#1F8FA6");
    for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) if (!((i === 0 || i === 3) && (j === 0 || j === 3))) bead(hp, 136 + i * 13, 20 + j * 13, 6, "#F5D547");
    strip(155, 68, 90, 3, "#F28B2E");
    strip(155, 72, 200, 4, "#3DB86B"); strip(155, 72, -20, 4, "#3DB86B");
    // 过关的打个勾(quest.js 是 defer 加载的,等它到了再读)
    document.addEventListener("DOMContentLoaded", () => {
      const done = (window.MBQuest && MBQuest.levels()) || {};
      document.querySelectorAll("[data-level]").forEach((a) => {
        if (!done[a.dataset.level]) return;
        const tag = document.createElement("span");
        tag.className = "level-done"; tag.textContent = "✓ 已过关";
        a.querySelector(".level-pic").appendChild(tag);
      });
      document.querySelectorAll("[data-go-join]").forEach((a) => a.addEventListener("click", () => {
        try { sessionStorage.setItem("mb.cta", JSON.stringify("demo-hub")); } catch (e) { /* 忽略 */ }
      }));
    });
  </script>
</body>
</html>
